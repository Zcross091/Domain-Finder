<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#border-grad)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Concentric Radar / Globe Latitude Rings -->
  <circle cx="32" cy="32" r="22" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35"/>
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25"/>
  <ellipse cx="32" cy="32" rx="8" ry="22" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Radar Crosshairs -->
  <line x1="32" y1="10" x2="32" y2="20" stroke="#00ff87" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="54" stroke="#00ff87" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="20" y2="32" stroke="#00ff87" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="54" y2="32" stroke="#00ff87" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Radar Sweep Slice -->
  <path d="M32 32 L50 20 A22 22 0 0 0 32 10 Z" fill="url(#sweep-grad)" opacity="0.45"/>

  <!-- Outer Satellite Dots -->
  <circle cx="47" cy="22" r="2" fill="#00ff87" filter="url(#glow)"/>
  <circle cx="19" cy="40" r="1.5" fill="#00e5ff" opacity="0.8"/>

  <!-- Glowing Core Beacon -->
  <circle cx="32" cy="32" r="5" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
